<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Визуал</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--cream:#f6efe4;--beige:#e9dcc6;--brown:#3a2a21;--soft:#7a6657;--pink:#c98791;--line:#d9c9b0;
--serif:"Cormorant Garamond",Georgia,serif;--sans:Inter,system-ui,sans-serif}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:var(--cream);color:var(--brown);font:16px/1.55 var(--sans);overflow-x:hidden}
:focus-visible{outline:2px solid var(--pink);outline-offset:2px}
nav{position:fixed;inset:0 0 auto 0;z-index:20;display:flex;justify-content:flex-end;padding:14px 24px;background:rgba(246,239,228,.95);border-bottom:1px solid var(--line)}
nav .links{display:flex;gap:22px;font-size:14px}
nav a{color:var(--brown);text-decoration:none}
nav a.on{color:var(--pink)}
main{max-width:1180px;margin:0 auto;padding:110px 24px 80px}
h2{font:400 clamp(34px,5vw,56px)/1.05 var(--serif);margin-bottom:28px}
.bw{margin-bottom:36px}
.ext{display:inline-block;margin-top:14px;color:var(--soft);font:500 18px var(--serif);text-decoration:none;border-bottom:1px solid var(--line)}
.ext:hover{color:var(--pink);border-color:var(--pink)}
footer{background:var(--brown);color:var(--cream);text-align:center;padding:64px 24px}
footer h3{font:400 34px var(--serif)}
footer p{opacity:.75;margin:8px 0 24px}
.soc{display:flex;gap:14px;justify-content:center}
.soc a{width:44px;height:44px;border:1px solid rgba(246,239,228,.4);border-radius:50%;display:grid;place-items:center}
.soc a:hover{background:var(--pink);border-color:var(--pink)}
.soc svg{width:20px;height:20px;fill:none;stroke:var(--cream);stroke-width:1.7}
@media(max-width:700px){nav .links{gap:14px;font-size:13px}main{padding:96px 14px 60px}}
</style>
</head>
<body>
<nav><div class="links"><a href="index.html#wishes">Желания</a><a href="index.html#progress">Прогресс</a><a class="on" href="visual.html">Визуал</a><a href="#contacts">Контакты</a></div></nav>

<main>
  <h2>Визуал</h2>
  <div id="boards"></div>
</main>

<footer id="contacts">
  <h3>Солянникова Олеся</h3>
  <p>Существо, обменявшее корни на крылья</p>
  <div class="soc" id="soc"></div>
</footer>

<script src="data.js"></script>
<script>
(function(){
const box=document.getElementById('boards');
PIN_BOARDS.forEach(b=>{
  const w=document.createElement('div');w.className='bw';
  w.innerHTML='<a data-pin-do="embedBoard" data-pin-scale-height="780" data-pin-scale-width="80" href="'+b.url+'"></a>'+
   '<a class="ext" href="'+b.url+'" target="_blank" rel="noopener">Открыть доску на Pinterest ↗</a>';
  box.appendChild(w)});
const sc=document.createElement('script');sc.async=true;sc.defer=true;sc.src='https://assets.pinterest.com/js/pinit.js';document.body.appendChild(sc);

const ic={instagram:'<rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.500" cy="6.500" r=".6"/>',
telegram:'<path d="M21 4 3 11l5 2 2 6 3-4 5 4z"/><path d="M8 13l9-6"/>'};
document.getElementById('soc').innerHTML=Object.keys(ic).map(k=>'<a href="'+SOCIAL[k]+'" aria-label="'+k+'" target="_blank" rel="noopener"><svg viewBox="0 0 24 24">'+ic[k]+'</svg></a>').join('');
})();
</script>
</body>
</html>
